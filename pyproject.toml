[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ief-parser"
version = "0.0.0"
description = "Read-only parser for Azure AD B2C custom policies (IEF) to normalized JSON."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Zubion" }
]
keywords = [
  "azure-ad-b2c",
  "entra-external-id",
  "identity-experience-framework",
  "ief",
  "custom-policies"
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.8.0"
]

[project.urls]
Homepage = "https://github.com/zubion-io/ief-parser"
Repository = "https://github.com/zubion-io/ief-parser"
Issues = "https://github.com/zubion-io/ief-parser/issues"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
